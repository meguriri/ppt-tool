<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>演示</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0e14; color: #e6edf3; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  #deck { position: fixed; left: 50%; top: 50%; width: 1280px; height: 720px;
    transform: translate(-50%, -50%) scale(1); transform-origin: center center; }
  .slide { position: absolute; inset: 0; visibility: hidden; opacity: 0; transition: opacity .25s ease; }
  .slide.active { visibility: visible; opacity: 1; }
  .slide iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  #progress { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, #7ee0ff, #7c5cff); z-index: 20; width: 0; }
  #nav { position: fixed; right: 22px; bottom: 18px; z-index: 20; display: flex; align-items: center; gap: 10px; }
  #nav button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid #30363d; background: #12161f;
    color: #e6edf3; font-size: 16px; cursor: pointer; }
  #nav button:hover { border-color: #7ee0ff; }
  #counter { font-size: 14px; color: #8b949e; margin-right: 6px; }
  #hint { font-size: 12px; color: #6e7681; margin-right: 8px; }
  #dots { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 20; display: flex; gap: 8px; }
  #dots button { width: 9px; height: 9px; border-radius: 50%; border: 0; padding: 0; background: #30363d; cursor: pointer; }
  #dots button.active { background: #7ee0ff; }
  @media print {
    @page { size: 1280px 720px; margin: 0; }
    html, body { overflow: visible; background: #fff; }
    #nav, #dots, #progress { display: none; }
    #deck { position: static; transform: none; width: 1280px; height: auto; }
    .slide { position: relative; visibility: visible; opacity: 1; page-break-after: always; width: 1280px; height: 720px; }
  }
</style>
</head>
<body>
<div id="progress"></div>
<main id="deck"></main>
<nav id="nav">
  <span id="hint">← → 翻页 · F 全屏</span>
  <span id="counter"></span>
  <button type="button" id="btnPrev" aria-label="上一页">◀</button>
  <button type="button" id="btnNext" aria-label="下一页">▶</button>
  <button type="button" id="btnFull" aria-label="全屏">⛶</button>
</nav>
<div id="dots"></div>
<script>
(function () {
  var MAX = 64;
  var deck = document.getElementById('deck');
  var progress = document.getElementById('progress');
  var counter = document.getElementById('counter');
  var dotsBox = document.getElementById('dots');
  var btnPrev = document.getElementById('btnPrev');
  var btnNext = document.getElementById('btnNext');
  var btnFull = document.getElementById('btnFull');
  var slides = [];
  var cur = 0;

  function pageExists(n) {
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      return fetch(n + '.html', { method: 'HEAD' })
        .then(function (r) { return r.ok; })
        .catch(function () { return false; });
    }
    // file://: iframe 对不存在的文件也会触发 load，无法区分；
    // 用 <object> 探测：存在的文件触发 load，缺失的文件触发 error（Chrome 已验证）。
    return new Promise(function (resolve) {
      var o = document.createElement('object');
      o.type = 'text/html';
      o.data = n + '.html';
      o.style.cssText = 'position:absolute;left:-10000px;width:50px;height:50px;visibility:hidden';
      var done = false;
      var fin = function (ok) { if (done) return; done = true; if (o.parentNode) o.parentNode.removeChild(o); resolve(ok); };
      o.onload = function () { fin(true); };
      o.onerror = function () { fin(false); };
      document.body.appendChild(o);
      setTimeout(function () { fin(false); }, 2500);
    });
  }

  function go(n) {
    cur = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach(function (s, i) { s.classList.toggle('active', i === cur); });
    var dots = Array.prototype.slice.call(dotsBox.children);
    dots.forEach(function (d, i) { d.classList.toggle('active', i === cur); });
    counter.textContent = (cur + 1) + ' / ' + slides.length;
    progress.style.width = ((cur + 1) / slides.length * 100) + '%';
  }

  function fit() {
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    deck.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }

  async function build() {
    var pages = [];
    for (var n = 1; n <= MAX; n++) {
      var ok = await pageExists(n);
      if (ok) pages.push(n);
      else if (pages.length > 0) break;
    }
    if (pages.length === 0) {
      deck.innerHTML = '<div style="color:#8b949e;font-size:24px;text-align:center;padding-top:280px;line-height:1.8">未找到编号页面（1.html, 2.html, ...）<br><span style="font-size:16px">file:// 下请用 Chrome 打开；若仍失败，请通过 http 服务打开（python3 -m http.server）</span></div>';
      return;
    }
    pages.forEach(function (n) {
      var s = document.createElement('div');
      s.className = 'slide';
      var f = document.createElement('iframe');
      f.src = n + '.html';
      f.title = '第 ' + n + ' 页';
      s.appendChild(f);
      deck.appendChild(s);
      slides.push(s);
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-label', '第 ' + n + ' 页');
      b.addEventListener('click', (function (i) { return function () { go(i); }; })(slides.length - 1));
      dotsBox.appendChild(b);
    });
    btnPrev.addEventListener('click', function () { go(cur - 1); });
    btnNext.addEventListener('click', function () { go(cur + 1); });
    btnFull.addEventListener('click', function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(cur + 1); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
      else if (e.key === 'Home') { go(0); }
      else if (e.key === 'End') { go(slides.length - 1); }
      else if (e.key === 'f' || e.key === 'F') { btnFull.click(); }
    });
    var tx = 0;
    document.addEventListener('touchstart', function (e) { tx = e.changedTouches[0].clientX; }, { passive: true });
    document.addEventListener('touchend', function (e) {
      var dx = e.changedTouches[0].clientX - tx;
      if (Math.abs(dx) > 60) go(cur + (dx < 0 ? 1 : -1));
    }, { passive: true });
    window.addEventListener('resize', fit);
    fit();
    go(0);
  }

  build();
})();
</script>
</body>
</html>
